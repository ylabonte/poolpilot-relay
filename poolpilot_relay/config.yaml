# Home Assistant app (add-on) configuration for the PoolPilot Relay.
# https://developers.home-assistant.io/docs/apps/configuration
#
# `version` is bumped automatically by .github/workflows/addon-release.yml on
# every stable `vX.Y.Z` tag, once the matching multi-arch image is published to
# ghcr — so it always names an image that exists.
name: PoolPilot Relay
version: "0.6.0"
slug: poolpilot_relay
description: >-
  Runs the PoolPilot edge agent as a Home Assistant app: bridges your ProCon.IP
  or VIOLET pool controller to the PoolPilot phone apps — directly over your LAN
  at home, and through a secure tunnel to the PoolPilot cloud when you are away.
url: https://github.com/ylabonte/poolpilot-relay
# Pre-built, generic multi-arch image — the Supervisor pulls it, it is never
# built on the user's device. The tag is set from `version` above.
image: ghcr.io/ylabonte/poolpilot-relay
# 64-bit only: Home Assistant deprecated the 32-bit arches (armv7/i386) in 2025.6
# and stopped refreshing updates for them after 2025.12.
arch:
  - aarch64
  - amd64
# mDNS discovery, reaching the controller on the LAN, and serving the pinned
# HTTPS pairing API to the phone apps all require the host network.
host_network: true
boot: auto
startup: application
# The one user-facing setting: the LAN port the pinned HTTPS pairing API binds
# and advertises over mDNS. A phone that pairs afterwards picks the port up from
# the SRV record; an already-paired phone keeps the port it paired on (the app
# does not re-resolve it), so set this BEFORE pairing. Change it only if another
# app already holds the default 8443 on the host network. The Supervisor writes
# this to /data/options.json; the agent reads it via HA_OPTIONS (see the Dockerfile).
options:
  lan_port: 8443
schema:
  lan_port: port
