name: addon-release

# Every relay release tag also produces the Home Assistant app release: build +
# push the multi-arch image to ghcr, then (stable tags only) bump the app's
# config.yaml version on main so the Supervisor offers the new build.
#
# Rollout authority: for the app channel, the version the Supervisor installs is
# governed solely by `version:` in config.yaml on the default branch (bumped
# below) — NOT by the PoolPilot control plane, which governs only the systemd
# self-update fleet. That split is intentional; the two channels roll out
# independently.
#
# One-time setup required before the first stable release can bump main:
#   * A GitHub App (or fine-grained token) with `contents: write` +
#     `pull requests: write` on this repo, exposed as the secrets
#     ADDON_BUMP_APP_ID / ADDON_BUMP_APP_PRIVATE_KEY. The bump opens an
#     auto-merging PR (App-authored, so required checks run) rather than pushing
#     to main directly — main's ruleset requires a PR + status checks.
#   * The ghcr package ghcr.io/ylabonte/poolpilot-relay must be made PUBLIC once
#     (Packages are private by default); until then the Supervisor and the
#     image-exists check below cannot pull it anonymously.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # build-only dry run (never pushes an image)

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ylabonte/poolpilot-relay

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr
      id-token: write # cosign keyless signing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - name: Validate tag shape
        if: github.ref_type == 'tag'
        run: |
          # Mirror release.yml: plain vX.Y.Z, optionally -rc.N, no leading zeros.
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] \
            || { echo "::error::tag '$GITHUB_REF_NAME' is not a plain vX.Y.Z[-rc.N] release tag — refusing to build."; exit 1; }

      - uses: actions/checkout@v7

      - name: Derive version + channel
        id: meta
        run: |
          # HA image tag / app version is the tag WITHOUT the leading v (0.4.0);
          # the in-binary version keeps the v-prefixed tag to match release.yml
          # and the form documented in cmd/poolpilot-relay/main.go.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "binver=${GITHUB_REF_NAME}"     >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "binver=dev"        >> "$GITHUB_OUTPUT"
          fi
          case "${GITHUB_REF_NAME}" in
            *-rc.*) echo "stable=false" >> "$GITHUB_OUTPUT" ;;
            *)      echo "stable=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      # No QEMU: the builder stage cross-compiles with Go on the native build
      # platform and the final stage is FROM scratch (no emulated RUN).
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }} # dispatch runs build-only
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.binver }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Tag :latest (stable tags only)
        if: github.ref_type == 'tag' && steps.meta.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref_type == 'tag'
      - name: Sign image (cosign keyless)
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  bump:
    # Stable release tags only: the published app tracks stable; rc images are
    # built above for rehearsal but never offered to users.
    needs: image
    if: github.ref_type == 'tag' && needs.image.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # main's ruleset requires a PR + status checks, so the bump lands via an
      # auto-merging PR authored by a GitHub App (App-authored PRs trigger the
      # required checks; GITHUB_TOKEN-authored ones would not).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ADDON_BUMP_APP_ID }}
          private-key: ${{ secrets.ADDON_BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify the image exists before bumping (image-before-bump ordering)
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          # The Supervisor reads `version:` from config.yaml on the default
          # branch; bumping ahead of a published, publicly-pullable image would
          # offer users a 404.
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null \
            || { echo "::error::${IMAGE}:${VERSION} not found or not anonymously pullable (is the ghcr package public?) — refusing to bump."; exit 1; }

      - name: Bump app version
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import re, sys
          v = sys.argv[1]
          p = "poolpilot_relay/config.yaml"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'(?m)^version:.*$', f'version: "{v}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Open auto-merging bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.image.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- poolpilot_relay/config.yaml; then
            echo "config.yaml already at ${VERSION}; nothing to do."
            exit 0
          fi
          # Per-version branch, so two releases never collide on a shared branch.
          BR="addon-release/${VERSION}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add poolpilot_relay/config.yaml
          git commit -m "chore(addon): release ${VERSION}"
          git push origin "$BR:refs/heads/$BR"
          gh pr create --base main --head "$BR" \
            --title "chore(addon): release ${VERSION}" \
            --body "Automated Home Assistant app version bump to \`${VERSION}\` (image \`${IMAGE}:${VERSION}\` is published). Auto-merges once required checks pass."
          gh pr merge --auto --squash "$BR"
