name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag shape
        run: |
          # Plain vX.Y.Z, optionally -rc.N for a pre-release rehearsal. No leading
          # zeros: control-plane's decodeRelease canonicalizes admin input
          # (adminrelease.go), and a v01.2.3 release URL could never be referenced
          # by that canonical DB row — reject it at the source, before any build.
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] \
            || { echo "::error::tag '$GITHUB_REF_NAME' is not a plain vX.Y.Z[-rc.N] release tag — refusing to build."; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          # The signing pubkey is stamped into BOTH binaries via ldflags: without
          # it update.PublicKey is empty and self-update fails closed (the agent
          # disables the updater, the helper refuses to run). Fail the build if
          # the key is missing — a keyless release could never verify an update.
          test -f deploy/relay/minisign.pub \
            || { echo "::error::deploy/relay/minisign.pub missing — run the key ceremony before releasing."; exit 1; }
          PUBKEY="$(grep -v '^untrusted comment:' deploy/relay/minisign.pub | tr -d '[:space:]')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X github.com/ylabonte/poolpilot-relay/internal/update.PublicKey=${PUBKEY}"
          # build <goos> <goarch> <goarm> <label> <cmd> <out-prefix> — pure Go
          # (CGO_ENABLED=0) cross-compiles anywhere. The `env` prefix is required,
          # not decorative: a bare assignment-prefix list (`FOO=bar cmd`) is
          # recognized by the shell PARSER before expansion, so when $3 is
          # non-empty the expanded ${3:+GOARM=$3} would become the COMMAND word
          # ("GOARM=7: command not found") instead of a prefix assignment. Words
          # after `env` are just environment entries — no such parse-time trap.
          build() {
            EXT=""; [ "$1" = "windows" ] && EXT=".exe"
            env GOOS="$1" GOARCH="$2" ${3:+GOARM=$3} CGO_ENABLED=0 \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/$6_$1_$4${EXT}" "./cmd/$5"
          }
          # Agent: every shipped platform. darwin/windows are binary-only — no
          # installer, no systemd unit, and RuntimeArch refuses non-linux GOOS.
          build linux   arm64   ""  arm64   poolpilot-relay poolpilot-relay
          build linux   arm     7   armv7   poolpilot-relay poolpilot-relay
          build linux   amd64   ""  amd64   poolpilot-relay poolpilot-relay
          build linux   386     ""  386     poolpilot-relay poolpilot-relay
          build linux   riscv64 ""  riscv64 poolpilot-relay poolpilot-relay
          build darwin  arm64   ""  arm64   poolpilot-relay poolpilot-relay
          build darwin  amd64   ""  amd64   poolpilot-relay poolpilot-relay
          build windows amd64   ""  amd64   poolpilot-relay poolpilot-relay
          # Helper: the five Linux/systemd targets only, so every installable
          # relay can self-update.
          build linux   arm64   ""  arm64   poolpilot-relay-updater poolpilot-relay-updater
          build linux   arm     7   armv7   poolpilot-relay-updater poolpilot-relay-updater
          build linux   amd64   ""  amd64   poolpilot-relay-updater poolpilot-relay-updater
          build linux   386     ""  386     poolpilot-relay-updater poolpilot-relay-updater
          build linux   riscv64 ""  riscv64 poolpilot-relay-updater poolpilot-relay-updater
          cp deploy/relay/poolpilot-relay.service dist/
          cp deploy/relay/poolpilot-relay-updater.service dist/
          cp deploy/relay/poolpilot-relay-updater.path dist/
          (cd dist && sha256sum * > sha256sums.txt)
          # Bind the release version into the SIGNED manifest so the privileged
          # helper reads an AUTHENTICATED version instead of trusting the
          # agent-written request.json — otherwise a compromised agent lies about
          # the version to bypass the roll-forward monotonicity gate and force a
          # downgrade to a signed-but-vulnerable release. Appended after the
          # checksums: AssetSum ignores this non-"<hash>  <name>" line and the
          # installer greps per-asset, so sha256sum -c never sees it.
          echo "# poolpilot-relay-version ${VERSION}" >> dist/sha256sums.txt

      - name: Sign checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # MUST run after sha256sums.txt is final: the signature covers the
          # checksum file, and the checksum file covers every asset. Verifying
          # any asset = verify the minisig, then check that asset's sha256.
          #
          # The key is passwordless (-W, ceremony decision 2026-07-26): a
          # password stored in the same secret store would protect nothing.
          # Verified: minisign signs fine with no TTY when the key has no
          # password (and would even accept one piped via stdin — an env var
          # would NOT work, minisign never reads a password from the env).
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          # Key-rotation lockstep: install.sh inlines the public key (its transport
          # bootstrap cannot read the repo); a rotation that updates minisign.pub +
          # MINISIGN_SECRET_KEY but misses install.sh would hard-fail every fresh
          # install at signature verification. Refuse to sign until they match.
          PUB_LINE="$(grep -v '^untrusted comment:' deploy/relay/minisign.pub | tr -d '[:space:]')"
          grep -qF "MINISIGN_PUBKEY=\"$PUB_LINE\"" deploy/relay/install.sh \
            || { echo "::error::deploy/relay/install.sh MINISIGN_PUBKEY does not match deploy/relay/minisign.pub — update install.sh as part of the key rotation."; exit 1; }

          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/sha256sums.txt
          # Fail loudly if the signature doesn't verify against the PUBLIC key
          # checked into the repo — that pairing is what key rotation must keep
          # in step, and a mismatch here means the fleet could not verify either.
          minisign -Vm dist/sha256sums.txt -p deploy/relay/minisign.pub

      - name: Verify fleet assets are present
        run: |
          # install.sh fetches these exact asset names from the release; a
          # published tag is immutable, so a build-step edit that renamed or
          # dropped one would ship a permanently-broken release. Assert they
          # exist before publishing — the forward half of the old dl-publish
          # allowlist, kept now that GitHub Releases is the channel.
          for f in poolpilot-relay_linux_arm64 poolpilot-relay_linux_armv7 \
                   poolpilot-relay_linux_amd64 poolpilot-relay_linux_386 \
                   poolpilot-relay_linux_riscv64 poolpilot-relay.service \
                   poolpilot-relay-updater_linux_arm64 poolpilot-relay-updater_linux_armv7 \
                   poolpilot-relay-updater_linux_amd64 poolpilot-relay-updater_linux_386 \
                   poolpilot-relay-updater_linux_riscv64 \
                   poolpilot-relay-updater.service poolpilot-relay-updater.path \
                   sha256sums.txt sha256sums.txt.minisig; do
            [ -f "dist/$f" ] || { echo "::error::release asset dist/$f is missing — the build step and the installer have diverged."; exit 1; }
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Releases IS the distribution channel now (public repo): the
          # agent binaries + sha256sums.txt + its .minisig are the release assets
          # install.sh fetches from releases/download/<tag>/. Publishing is INERT —
          # no relay is offered this version until an operator promotes it in
          # admin-ui; control-plane keeps rollout authority and CI has no write
          # path into it. rc tags are marked --prerelease so they stay off
          # the "Latest" badge and out of releases/latest. (They are already
          # invisible to Go MVS, which ignores prerelease tags, and to
          # /install-target, since control-plane's relver rejects pre-release
          # suffixes — an rc can't be promoted.)
          case "$GITHUB_REF_NAME" in *-rc.*) PRE=--prerelease;; *) PRE=;; esac
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "poolpilot-relay ${GITHUB_REF_NAME}" \
            --generate-notes $PRE
