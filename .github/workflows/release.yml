name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cross-compile agent binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          # build <goos> <goarch> <goarm> <asset-suffix> — the relay agent is
          # pure Go (CGO_ENABLED=0), so it cross-compiles to any platform.
          # darwin/windows are binary-only (no installer, no systemd unit).
          build() {
            EXT=""; [ "$1" = "windows" ] && EXT=".exe"
            # `env` is required, not decorative: a bare assignment-prefix list
            # (`FOO=bar cmd`) is recognized by the shell PARSER before any
            # expansion runs, so when $3 is non-empty the expanded
            # ${3:+GOARM=$3} becomes the COMMAND word itself ("GOARM=7: command
            # not found") instead of another prefix assignment. Expanded words
            # after `env` are just environment entries — env has no such
            # parse-time restriction.
            env GOOS="$1" GOARCH="$2" ${3:+GOARM=$3} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/poolpilot-relay_$1_$4${EXT}" ./cmd/poolpilot-relay
          }
          build linux arm64 "" arm64
          build linux arm 7 armv7
          build linux amd64 "" amd64
          build linux 386 "" 386
          build linux riscv64 "" riscv64
          build darwin arm64 "" arm64
          build darwin amd64 "" amd64
          build windows amd64 "" amd64
          cp deploy/relay/poolpilot-relay.service dist/
          (cd dist && sha256sum * > sha256sums.txt)

      - name: Sign checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # MUST run after sha256sums.txt is final: the signature covers the
          # checksum file, and the checksum file covers every asset. Verifying
          # any asset = verify the minisig, then check that asset's sha256.
          #
          # The key is passwordless (-W, ceremony decision 2026-07-26): a
          # password stored in the same secret store would protect nothing.
          # Verified: minisign signs fine with no TTY when the key has no
          # password (and would even accept one piped via stdin — an env var
          # would NOT work, minisign never reads a password from the env).
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          # Key-rotation lockstep: install.sh inlines the public key (its transport
          # bootstrap cannot read the repo); a rotation that updates minisign.pub +
          # MINISIGN_SECRET_KEY but misses install.sh would hard-fail every fresh
          # install at signature verification. Refuse to sign until they match.
          PUB_LINE="$(grep -v '^untrusted comment:' deploy/relay/minisign.pub | tr -d '[:space:]')"
          grep -qF "MINISIGN_PUBKEY=\"$PUB_LINE\"" deploy/relay/install.sh \
            || { echo "::error::deploy/relay/install.sh MINISIGN_PUBKEY does not match deploy/relay/minisign.pub — update install.sh as part of the key rotation."; exit 1; }

          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/sha256sums.txt
          # Fail loudly if the signature doesn't verify against the PUBLIC key
          # checked into the repo — that pairing is what key rotation must keep
          # in step, and a mismatch here means the fleet could not verify either.
          minisign -Vm dist/sha256sums.txt -p deploy/relay/minisign.pub

      - name: Stage the publishable allowlist
        run: |
          # THE constraint of this whole design: only the relay AGENT binary is
          # publicly downloadable. Never control-plane, admin-ui or pushcheck;
          # never release notes (--generate-notes synthesizes those from private
          # commit and PR titles). Today the build step only produces the agent,
          # but nothing enforced that — a future "just add pushcheck for ops" commit
          # would have silently published an internal binary. This step is that
          # enforcement.
          #
          # Adding an entry here is a deliberate decision to make that file
          # world-downloadable. When the #15 updater helper ships, its binaries
          # and the two systemd units join this list — that is the one expected
          # amendment.
          #
          # darwin/* and windows/* stay in the PRIVATE GitHub release (developer
          # convenience); the vhost is the Linux/systemd fleet channel only.
          mkdir -p publish
          ALLOWED="
            poolpilot-relay_linux_arm64
            poolpilot-relay_linux_armv7
            poolpilot-relay_linux_amd64
            poolpilot-relay_linux_386
            poolpilot-relay_linux_riscv64
            poolpilot-relay.service
            sha256sums.txt
            sha256sums.txt.minisig
          "
          for f in $ALLOWED; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::allowlisted asset dist/$f is missing — the build step and the publish allowlist have diverged."
              exit 1
            fi
            cp "dist/$f" "publish/$f"
          done
          # Reverse check: anything in publish/ that is not allowlisted is a bug
          # in this step itself.
          for f in publish/*; do
            base=$(basename "$f")
            echo "$ALLOWED" | tr -s '[:space:]' '\n' | grep -qxF "$base" || {
              echo "::error::$base is staged for publication but not allowlisted."
              exit 1
            }
          done
          echo "publishing $(ls -1 publish | wc -l) allowlisted assets:"
          ls -1 publish

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # Same posture as deploy.yml: key material in RUNNER_TEMP (wiped at
          # job end), and the host key PINNED from a secret rather than
          # ssh-keyscan'd at run time (keyscan is trust-on-first-use per run).
          # Neither workflow falls back to keyscan — an unpinned host is never
          # worth the convenience.
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set — refusing to publish over an unpinned host key."
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Publish to dl.poolpilot.eu
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Tag names feed a remotely shell-evaluated path — refuse anything but a
          # plain release tag before composing DEST (git allows ' $( ; in refs).
          # No leading zeros: relver canonicalizes "v01.2.3" to "v1.2.3" for the
          # DB row, and a published /relay/v01.2.3/ directory could never be
          # referenced by that canonicalized version — so reject it at publish
          # time rather than let it land as an unreachable directory.
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::tag '$GITHUB_REF_NAME' is not a plain vX.Y.Z release tag — refusing to publish."; exit 1; }
          DEST="/srv/poolpilot/dl/relay/${GITHUB_REF_NAME}"
          SSH_OPTS="-p 2022 -i $RUNNER_TEMP/ssh/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes"
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "deploy@$SSH_HOST" "mkdir -p '$DEST'"
          # shellcheck disable=SC2086
          scp -P 2022 -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            publish/* "deploy@$SSH_HOST:$DEST/"
          # Publishing is INERT: no relay is offered this version until an
          # operator promotes it in admin-ui. That is the deliberate
          # "ship it inert, flip it on" pattern (cf. ATTEST_MODE, the staged
          # pair vhost) and it is why CI needs no write path into control-plane.
          echo "Published ${GITHUB_REF_NAME}. Promote it in admin-ui to roll it out."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "poolpilot-relay ${GITHUB_REF_NAME}" \
            --generate-notes
